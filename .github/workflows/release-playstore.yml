name: Release PlayStore (Signed AAB)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer bump for the next release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — main branch only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow must run from main (current: ${{ github.ref }})."
          exit 1

      - name: Compute next SemVer tag
        id: compute
        run: |
          BUMP="${{ github.event.inputs.bump }}"
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "No semver tags found — falling back to v1.0.0"
            MAJOR=1; MINOR=0; PATCH=0
          else
            echo "Latest semver tag: $LATEST_TAG"
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          fi
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
          esac
          NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Next tag: $NEXT_TAG (version: $NEXT_VERSION)"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Pre-check tag & release idempotency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.compute.outputs.tag }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — checking for idempotent re-publish."
            DRAFT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true and .target_commitish == \"${GITHUB_SHA}\") | .id" 2>/dev/null | head -1)
            if [ -z "$DRAFT_ID" ]; then
              echo "::error::Tag ${TAG} exists but no draft release on this commit (${GITHUB_SHA}). Aborting to avoid clobbering."
              exit 1
            fi
            echo "Draft release ${DRAFT_ID} targets this commit — idempotent re-publish OK."
          else
            echo "Tag ${TAG} is free — proceeding."
          fi

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: .github/workflows/scripts/free_disk_space.sh

      - uses: game-ci/unity-builder@v4
        with:
          projectPath: .
          targetPlatform: Android
          androidExportType: androidAppBundle
          buildName: MissileCommand1980
          buildsPath: build
          versioning: Custom
          version: ${{ needs.validate.outputs.version }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: .github/release.keystore
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Verify AAB and normalize
        run: |
          set -euo pipefail
          AAB=$(find build/Android -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::No .aab found under build/Android"
            exit 1
          fi
          echo "Found AAB: $AAB"
          mkdir -p release
          cp "$AAB" "release/MissileCommand1980-${VERSION}.aab"
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: release
          retention-days: 1

  publish:
    needs: [validate, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: release

      - name: Verify AAB downloaded
        run: |
          set -euo pipefail
          test -n "$(find release -name '*.aab' | head -1)" || { echo "::error::AAB missing after download"; exit 1; }
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MissileCommand1980 ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          files: release/MissileCommand1980-${{ needs.validate.outputs.version }}.aab